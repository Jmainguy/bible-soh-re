apiVersion: apps/v1
kind: Deployment
metadata:
  name: bible-soh-re
  namespace: bible-soh-re
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bible-soh-re
  template:
    metadata:
      labels:
        app: bible-soh-re
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: bible-soh-re
        image: zot.soh.re/jmainguy/bible-soh-re:v1.3.1
        workingDir: /
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-cluster-app
              key: uri
        - name: TRANSLATIONS_DIR
          value: /translations
        - name: BASE_URL
          value: https://bible.soh.re
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: translations
          mountPath: /translations
          readOnly: true
        - name: uploads
          mountPath: /static/uploads
      volumes:
      - name: translations
        persistentVolumeClaim:
          claimName: bible-translations
      - name: uploads
        persistentVolumeClaim:
          claimName: bible-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: bible-soh-re
  namespace: bible-soh-re
spec:
  selector:
    app: bible-soh-re
  ports:
  - name: http
    port: 80
    targetPort: 8080
