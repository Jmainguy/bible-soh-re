<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Reader</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f5f1e8;
        }
        .bible-page {
            background-color: #fffef9;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1), inset 0 0 100px rgba(139,69,19,0.02);
        }
        .verse-container {
            font-family: 'EB Garamond', 'Crimson Text', Georgia, serif;
            font-size: 1.125rem;
            line-height: 1.7;
            text-align: justify;
            hyphens: auto;
        }
        .verse-number {
            color: #8b4513;
            font-weight: 600;
            font-size: 0.7rem;
            position: absolute;
            left: -2rem;
            width: 1.5rem;
            text-align: right;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }
        .verse-number:hover {
            color: #2563eb;
            text-decoration: underline;
        }
        .verse {
            margin-bottom: 0.5rem;
            position: relative;
            padding-left: 0;
        }
        .verse-text {
            display: inline;
        }
        .verse-text sup {
            color: #2563eb;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: help;
        }
        .hide-references .verse-text sup {
            display: none;
        }
        .verse-references {
            font-size: 0.875rem;
            margin-top: 0.25rem;
            padding-left: 2rem;
            line-height: 1.6;
            font-style: italic;
            color: #6b5d4f;
            break-inside: avoid;
        }
        .section-title {
            font-family: 'EB Garamond', 'Crimson Text', Georgia, serif;
            letter-spacing: 0.025em;
            text-align: center;
            font-variant: small-caps;
            break-after: avoid;
            column-span: all;
        }
        .chapter-heading {
            font-family: 'EB Garamond', Georgia, serif;
            text-align: center;
            color: #5d4e37;
        }
        .reference {
            display: inline;
        }
        .reference-link {
            cursor: pointer;
            text-decoration: underline;
            color: #2563eb;
        }
        .reference-link:hover {
            color: #1d4ed8;
        }
        .running-header {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 0.875rem;
            color: #8b7355;
            text-align: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e5dcc8;
            margin-bottom: 1rem;
            font-variant: small-caps;
            letter-spacing: 0.05em;
        }
        .settings-panel {
            background-color: #fffef9;
            border: 1px solid #e5dcc8;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        .settings-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
        }
        .settings-toggle input[type="checkbox"] {
            cursor: pointer;
        }
        .content-wrapper {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 3fr);
            gap: 1.5rem;
            transition: grid-template-columns 0.3s ease-in-out;
        }
        .content-wrapper.sidebar-collapsed {
            grid-template-columns: 0fr minmax(0, 1fr);
        }
        .sidebar {
            transition: all 0.3s ease-in-out;
            overflow: hidden;
        }
        .sidebar.collapsed {
            opacity: 0;
            pointer-events: none;
        }
        .main-content {
            transition: all 0.3s ease-in-out;
        }
        .toggle-sidebar {
            display: none;
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }
        @media (max-width: 1024px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }
            .content-wrapper.sidebar-collapsed {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: 80%;
                max-width: 320px;
                z-index: 100;
                background: white;
                transform: translateX(-100%);
                box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            }
            .sidebar:not(.collapsed) {
                transform: translateX(0);
            }
            .toggle-sidebar {
                display: inline-block;
            }
            .bible-page {
                padding: 1rem !important;
                padding-bottom: 8rem !important;
            }
            .verse-container {
                font-size: 1rem;
                line-height: 1.6;
                padding-bottom: 4rem;
            }
        }
        .verse-comments {
            margin-top: 0.75rem;
            padding: 1rem;
            background-color: #f9f5ff;
            border-left: 3px solid #9333ea;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }
        .verse-comment {
            margin-bottom: 0.75rem;
            padding: 0.75rem;
            background-color: white;
            border-radius: 0.375rem;
            border: 1px solid #e9d5ff;
        }
        .verse-comment-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.813rem;
        }
        .verse-comment-content {
            color: #374151;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .verse-comment-reply {
            margin-left: 1.5rem;
            margin-top: 0.5rem;
            padding-left: 0.75rem;
            border-left: 2px solid #e9d5ff;
        }
        .verse-comment-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
            font-size: 0.75rem;
        }
        .verse-comment-action {
            color: #7c3aed;
            cursor: pointer;
            text-decoration: none;
        }
        .verse-comment-action:hover {
            text-decoration: underline;
        }
        .verse-comment-form {
            margin-top: 0.75rem;
        }
        .verse-comment-form textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #e9d5ff;
            border-radius: 0.375rem;
            resize: vertical;
            font-family: inherit;
            font-size: 0.875rem;
        }
        .verse-comment-form button {
            margin-top: 0.5rem;
            padding: 0.375rem 0.75rem;
            background-color: #9333ea;
            color: white;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.813rem;
            transition: background-color 0.2s;
        }
        .verse-comment-form button:hover {
            background-color: #7c3aed;
        }
        .verse-comment-form button:disabled {
            background-color: #d1d5db;
            cursor: not-allowed;
        }
        .hide-verse-comments .verse-comments,
        .hide-verse-comments .verse-comment-add-btn,
        .hide-verse-comments .verse-comments-empty {
            display: none;
        }
        .verse-comments-empty {
            margin-top: 0.5rem;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-blue-900 text-white shadow-lg">
            <div class="container mx-auto px-4 py-3 md:py-6">
                <div class="flex items-center justify-between">
                    <!-- Mobile menu button -->
                    <button id="toggleSidebar" class="toggle-sidebar bg-blue-700 hover:bg-blue-600 text-white p-2 rounded-lg transition">
                        <svg id="sidebarIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    
                    <div class="flex-1">
                        <h1 id="translationFullName" class="text-xl md:text-3xl font-bold text-center">Holy Bible</h1>
                        <p id="translationDescription" class="text-center text-blue-200 mt-1 md:mt-2 text-sm md:text-base"></p>
                    </div>
                    
                    <!-- Right side menu items -->
                    <div class="flex items-center gap-2">
                        <!-- Community Menu -->
                        <div id="communityMenu" class="hidden">
                            <div class="relative">
                                <button id="communityMenuButton" class="flex items-center gap-2 bg-blue-700 hover:bg-blue-600 px-3 py-2 rounded-lg transition">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                                    </svg>
                                    <span class="text-sm hidden md:inline">Community</span>
                                </button>
                                <div id="communityDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-1 z-50">
                                    <a href="/groups" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Study Groups</a>
                                </div>
                            </div>
                        </div>
                        
                        <!-- User Menu -->
                        <div id="userMenu" class="hidden">
                            <div class="relative">
                                <button id="userMenuButton" class="flex items-center gap-2 bg-blue-700 hover:bg-blue-600 px-3 py-2 rounded-lg transition">
                                    <div id="userProfilePic"></div>
                                    <span id="userName" class="text-sm hidden md:inline"></span>
                                </button>
                                <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-1 z-50">
                                    <div class="px-4 py-2 border-b border-gray-200">
                                        <p class="text-sm text-gray-700 font-medium" id="userEmail"></p>
                                    </div>
                                    <a href="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Edit Profile</a>
                                    <a href="/auth/logout" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Sign Out</a>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Login Button (shown when not authenticated) -->
                        <a id="loginButton" href="/login" class="bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded-lg transition text-sm">
                            Sign In
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="container mx-auto px-2 md:px-4 py-4 md:py-8">
            <div id="contentWrapper" class="content-wrapper">
                <!-- Sidebar - Book Selection -->
                <div id="sidebar" class="sidebar">
                    <div class="bg-white rounded-lg shadow-md p-4 sticky top-4">
                        <!-- Translation Selector -->
                        <div class="mb-4">
                            <label for="translationSelect" class="block text-sm font-medium text-gray-700 mb-2">Translation</label>
                            <select id="translationSelect" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        
                        <h2 class="text-xl font-bold mb-4 text-gray-800">Books</h2>
                        <div id="bookList" class="space-y-1 max-h-[70vh] overflow-y-auto">
                            <div class="text-gray-500 text-sm">Loading books...</div>
                        </div>
                    </div>
                </div>

                <!-- Main Reading Area -->
                <div id="mainContent" class="main-content">
                    <div class="bible-page rounded-lg shadow-md p-4 md:p-8 relative">
                        <!-- Chapter Navigation -->
                        <div class="mb-4 md:mb-6 pb-3 md:pb-4 border-b border-gray-200">
                            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 md:gap-0 mb-3 md:mb-4">
                                <h2 id="chapterTitle" class="text-lg md:text-2xl font-bold text-gray-800">
                                    Loading...
                                </h2>
                                <div class="flex flex-wrap gap-2">
                                    <button id="toggleReferences" class="px-3 py-1.5 md:px-4 md:py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition text-xs md:text-sm flex-shrink-0">
                                        <svg class="w-4 h-4 md:w-5 md:h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
                                        <span class="hidden sm:inline">Show References</span>
                                    </button>
                                    <button id="toggleVerseComments" class="px-3 py-1.5 md:px-4 md:py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 transition text-xs md:text-sm flex-shrink-0 hidden">
                                        <svg class="w-4 h-4 md:w-5 md:h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                                        <span class="hidden sm:inline">Show Notes</span>
                                    </button>
                                    <select id="verseCommentsGroupSelect" class="px-3 py-1.5 md:px-4 md:py-2 bg-white border border-gray-300 rounded-md text-xs md:text-sm flex-shrink-0 hidden">
                                        <option value="">Personal Notes</option>
                                    </select>
                                    <button id="prevChapter" class="px-3 py-1.5 md:px-4 md:py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition text-xs md:text-sm flex-1 md:flex-initial" disabled>
                                        <span class="hidden sm:inline">←</span> Prev
                                    </button>
                                    <button id="nextChapter" class="px-3 py-1.5 md:px-4 md:py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition text-xs md:text-sm flex-1 md:flex-initial" disabled>
                                        Next <span class="hidden sm:inline">→</span>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Chapter Selector -->
                            <div id="chapterSelector" class="hidden">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Jump to Chapter:</label>
                                <select id="chapterSelect" class="w-full md:w-64 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="">Select chapter...</option>
                                </select>
                            </div>
                        </div>

                        <!-- Verses Display -->
                        <div id="versesContainer" class="prose max-w-none">
                            <div class="text-gray-500 text-center py-12">
                                <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                                </svg>
                                <p class="text-lg">Select a book from the sidebar to start reading</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Note Editor Modal -->
        <div id="noteEditorModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-xl p-8 max-w-2xl w-full mx-4 shadow-2xl">
                <h2 id="noteEditorTitle" class="text-2xl font-bold mb-4 text-gray-800">
                    Create Note
                </h2>
                <textarea id="noteEditorContent" 
                          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent resize-none"
                          rows="8"
                          placeholder="Enter your note here..."></textarea>
                <div class="flex gap-3 mt-6">
                    <button id="noteEditorSave" class="flex-1 px-6 py-3 bg-gradient-to-r from-amber-600 to-amber-700 text-white rounded-lg font-medium hover:from-amber-700 hover:to-amber-800 transition">
                        Save
                    </button>
                    <button id="noteEditorCancel" class="flex-1 px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300 transition">
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div id="deleteConfirmModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-xl p-8 max-w-md w-full mx-4 shadow-2xl">
                <h2 class="text-2xl font-bold mb-4 text-gray-800">
                    Delete Note
                </h2>
                <p class="mb-6 text-gray-600">
                    Are you sure you want to delete this note? This action cannot be undone.
                </p>
                <div class="flex gap-3">
                    <button id="deleteConfirmYes" class="flex-1 px-6 py-3 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 transition">
                        Delete
                    </button>
                    <button id="deleteConfirmNo" class="flex-1 px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300 transition">
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- Message Modal -->
        <div id="noteMessageModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-xl p-8 max-w-md w-full mx-4 shadow-2xl">
                <h2 id="noteMessageTitle" class="text-2xl font-bold mb-4 text-gray-800">
                    Message
                </h2>
                <p id="noteMessageText" class="mb-6 text-gray-600">
                </p>
                <button id="noteMessageOk" class="w-full px-6 py-3 bg-gradient-to-r from-amber-600 to-amber-700 text-white rounded-lg font-medium hover:from-amber-700 hover:to-amber-800 transition">
                    OK
                </button>
            </div>
        </div>
        
        <!-- Sidebar overlay for mobile -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
