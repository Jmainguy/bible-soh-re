name: Social features and reader tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: go test -race ./...
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/postgres?sslmode=disable
      - run: node --test tests/*.test.cjs
      - run: npm ci && npm run build:css && git diff --exit-code -- static/tailwind.css
