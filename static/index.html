<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f5f1e8;
        }
        .bible-page {
            background-color: #fffef9;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1), inset 0 0 100px rgba(139,69,19,0.02);
        }
        .verse-container {
            font-family: 'EB Garamond', 'Crimson Text', Georgia, serif;
            font-size: 1.125rem;
            line-height: 1.7;
            text-align: justify;
            hyphens: auto;
        }
        .verse-number {
            color: #8b4513;
            font-weight: 600;
            font-size: 0.7rem;
            position: absolute;
            left: -2rem;
            width: 1.5rem;
            text-align: right;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }
        .verse-number:hover {
            color: #2563eb;
            text-decoration: underline;
        }
        .verse {
            margin-bottom: 0.5rem;
            position: relative;
            padding-left: 0;
        }
        .verse-text {
            display: inline;
        }
        .verse-text sup {
            color: #2563eb;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: help;
        }
        .hide-references .verse-text sup {
            display: none;
        }
        .verse-references {
            font-size: 0.875rem;
            margin-top: 0.25rem;
            padding-left: 2rem;
            line-height: 1.6;
            font-style: italic;
            color: #6b5d4f;
            break-inside: avoid;
        }
        .section-title {
            font-family: 'EB Garamond', 'Crimson Text', Georgia, serif;
            letter-spacing: 0.025em;
            text-align: center;
            font-variant: small-caps;
            break-after: avoid;
            column-span: all;
        }
        .chapter-heading {
            font-family: 'EB Garamond', Georgia, serif;
            text-align: center;
            color: #5d4e37;
        }
        .reference {
            display: inline;
        }
        .reference-link {
            cursor: pointer;
            text-decoration: underline;
            color: #2563eb;
        }
        .reference-link:hover {
            color: #1d4ed8;
        }
        .running-header {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 0.875rem;
            color: #8b7355;
            text-align: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e5dcc8;
            margin-bottom: 1rem;
            font-variant: small-caps;
            letter-spacing: 0.05em;
        }
        .settings-panel {
            background-color: #fffef9;
            border: 1px solid #e5dcc8;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        .settings-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
        }
        .settings-toggle input[type="checkbox"] {
            cursor: pointer;
        }
        .content-wrapper {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 3fr);
            gap: 1.5rem;
            transition: grid-template-columns 0.3s ease-in-out;
        }
        .content-wrapper.sidebar-collapsed {
            grid-template-columns: 0fr minmax(0, 1fr);
        }
        .sidebar {
            transition: all 0.3s ease-in-out;
            overflow: hidden;
        }
        .sidebar.collapsed {
            opacity: 0;
            pointer-events: none;
        }
        .main-content {
            transition: all 0.3s ease-in-out;
        }
        .toggle-sidebar {
            position: fixed;
            left: 1rem;
            top: 7rem;
            z-index: 50;
            transition: all 0.3s ease-in-out;
        }
        .toggle-sidebar.sidebar-hidden {
            left: 1rem;
        }
        @media (max-width: 1024px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }
            .content-wrapper.sidebar-collapsed {
                grid-template-columns: 1fr;
            }
            .toggle-sidebar {
                top: 6rem;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-blue-900 text-white shadow-lg">
            <div class="container mx-auto px-4 py-6">
                <h1 id="translationFullName" class="text-3xl font-bold text-center">Holy Bible</h1>
                <p id="translationDescription" class="text-center text-blue-200 mt-2"></p>
            </div>
        </header>

        <!-- Main Content -->
        <div class="container mx-auto px-4 py-8">
            <!-- Sidebar Toggle Button -->
            <button id="toggleSidebar" class="toggle-sidebar bg-blue-600 text-white p-3 rounded-lg shadow-lg hover:bg-blue-700 transition">
                <svg id="sidebarIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <div id="contentWrapper" class="content-wrapper">
                <!-- Sidebar - Book Selection -->
                <div id="sidebar" class="sidebar">
                    <div class="bg-white rounded-lg shadow-md p-4 sticky top-4">
                        <!-- Translation Selector -->
                        <div class="mb-4">
                            <label for="translationSelect" class="block text-sm font-medium text-gray-700 mb-2">Translation</label>
                            <select id="translationSelect" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        
                        <h2 class="text-xl font-bold mb-4 text-gray-800">Books</h2>
                        <div id="bookList" class="space-y-1 max-h-[70vh] overflow-y-auto">
                            <div class="text-gray-500 text-sm">Loading books...</div>
                        </div>
                    </div>
                </div>

                <!-- Main Reading Area -->
                <div id="mainContent" class="main-content">
                    <div class="bible-page rounded-lg shadow-md p-8 relative">
                        <!-- Chapter Navigation -->
                        <div class="mb-6 pb-4 border-b border-gray-200">
                            <div class="flex items-center justify-between mb-4">
                                <h2 id="chapterTitle" class="text-2xl font-bold text-gray-800">
                                    Select a book to begin
                                </h2>
                                <div class="flex gap-2">
                                    <button id="toggleReferences" class="px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition text-sm">
                                        <svg class="w-5 h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                        </svg>
                                        Hide References
                                    </button>
                                    <button id="prevChapter" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition" disabled>
                                        ← Previous
                                    </button>
                                    <button id="nextChapter" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition" disabled>
                                        Next →
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Chapter Selector -->
                            <div id="chapterSelector" class="hidden">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Jump to Chapter:</label>
                                <select id="chapterSelect" class="w-full md:w-64 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="">Select chapter...</option>
                                </select>
                            </div>
                        </div>

                        <!-- Verses Display -->
                        <div id="versesContainer" class="prose max-w-none">
                            <div class="text-gray-500 text-center py-12">
                                <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                                </svg>
                                <p class="text-lg">Select a book from the sidebar to start reading</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
